<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登大人島｜展演骨架 v0.4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap">
<style>
:root{
  --paper:#f5f0e6; --paper2:#ebe4d5; --card:#fbf8f2;
  --ink:#33312d; --ink2:#6f6a60; --line:#bdb5a6;
  --lamp:#e09a2e; --lampsoft:#f7e2b8; --sea:#dbe6e4; --sea2:#b9cfcd;
  --red:#b4442f; --ok:#5f7d5a;
  --r:16px 20px 14px 18px / 18px 14px 20px 16px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:"LXGW WenKai TC","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:18px;line-height:1.6;
  background-image:radial-gradient(rgba(0,0,0,.025) 1px,transparent 1px);background-size:5px 5px}
button{font:inherit;color:inherit}
h1,h2,h3{font-weight:700;margin:.2em 0 .5em;line-height:1.35}
h2{font-size:1.45rem}
p{margin:.35em 0}
.hide{display:none!important}
.tiny{font-size:.82rem;color:var(--ink2)}
.lead{color:var(--ink2)}
.big{font-size:1.3rem}
.right{text-align:right}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:14px}

/* header */
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;padding:10px 22px;background:rgba(245,240,230,.94);border-bottom:1.5px solid var(--line);backdrop-filter:blur(4px)}
.brand{font-weight:700;font-size:1.25rem;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand i{width:12px;height:12px;border-radius:50%;background:var(--lamp);box-shadow:0 0 0 5px rgba(224,154,46,.22)}
.tabs{display:flex;gap:6px}
.tab{border:1.5px solid transparent;background:none;padding:5px 14px;border-radius:var(--r);cursor:pointer;color:var(--ink2)}
.tab.on{border-color:var(--ink);color:var(--ink);background:var(--card)}
.hsp{flex:1}
.hbtn{border:1.5px solid var(--line);background:var(--card);padding:5px 12px;border-radius:var(--r);cursor:pointer;font-size:.92rem;white-space:nowrap}
.hbtn.need{border-color:var(--lamp);background:var(--lampsoft)}
.hbtn.need::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--lamp);margin-right:6px;vertical-align:middle}

main{max-width:1320px;margin:0 auto;padding:22px 26px 90px}

/* buttons */
.btn{border:1.6px solid var(--ink);background:var(--card);padding:9px 20px;border-radius:var(--r);cursor:pointer;transition:transform .12s,background .2s;text-align:left}
.btn:hover{transform:translateY(-1px);background:#fff}
.btn.primary{background:var(--lampsoft);border-color:var(--ink)}
.btn.ghost{border-color:var(--line);color:var(--ink2);background:transparent}
.btn.sm{padding:5px 13px;font-size:.9rem}
.btn.huge{font-size:1.35rem;padding:18px 34px}
.btn.chip{border-color:var(--line);padding:8px 18px}
.btn.chip.sel{border-color:var(--ink);background:var(--lampsoft)}
.linkb{border:none;background:none;color:var(--ink2);text-decoration:underline;cursor:pointer;padding:0;font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.chips.col{flex-direction:column;align-items:flex-start}
input[type=text],textarea{font:inherit;width:100%;max-width:560px;border:1.5px solid var(--line);border-radius:12px;background:#fff;padding:9px 12px}
textarea{resize:vertical}
.own{display:flex;gap:10px;align-items:center;margin-top:8px;max-width:620px}
.chk{display:flex;gap:8px;align-items:center;font-size:.92rem;color:var(--ink2);margin-top:8px}

/* scene: achao dialog */
.scene{display:grid;grid-template-columns:minmax(220px,36%) 1fr;gap:34px;align-items:center;min-height:calc(100vh - 190px)}
.scene .art{display:flex;justify-content:center;align-items:flex-end}
.scene .art svg{width:100%;max-width:300px;height:auto}
.bubble{position:relative;background:var(--card);border:1.6px solid var(--ink);border-radius:var(--r);padding:20px 26px;max-width:640px}
.bubble::before{content:"";position:absolute;left:-14px;top:38px;width:22px;height:22px;background:var(--card);border-left:1.6px solid var(--ink);border-bottom:1.6px solid var(--ink);transform:rotate(45deg)}
.bubble .who{font-size:.85rem;color:var(--ink2)}
.bubble p{font-size:1.3rem;opacity:0;animation:fade .5s forwards}
.bubble p:nth-of-type(2){animation-delay:.7s}
.bubble p:nth-of-type(3){animation-delay:1.4s}
.opts{display:flex;flex-direction:column;align-items:flex-start;gap:10px;margin-top:20px;opacity:0;animation:fade .5s 1.1s forwards}
.opts .btn{min-width:280px}
@keyframes fade{to{opacity:1}}

/* facility page */
.fpage{max-width:980px;margin:0 auto}
.fhead{display:flex;align-items:center;gap:18px;margin-bottom:14px}
.fhead svg{width:84px;height:84px;flex:none}
.fhead h1{margin:0;font-size:2rem}
.fhead .sub{color:var(--ink2)}
.box{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:18px 22px;margin:12px 0}
.box.red{border-color:var(--red);border-width:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.ucard{background:var(--card);border:1.6px solid var(--ink);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.ucard.site{border-style:dashed;border-color:var(--line);color:var(--ink2)}
.ucard h3{margin:0}
.skill3{display:flex;gap:6px;margin:4px 0}
.skill3 span{font-size:.75rem;padding:1px 8px;border:1.3px dashed var(--line);border-radius:10px;color:var(--ink2)}
.skill3 span.on{border-style:solid;border-color:var(--lamp);background:var(--lampsoft);color:var(--ink)}
.tag{display:inline-block;font-size:.75rem;padding:1px 9px;border-radius:10px;border:1.3px solid var(--line);color:var(--ink2);white-space:nowrap}
.tag.run{border-color:var(--ok);color:var(--ok)}
.tag.sim{border-color:var(--lamp);color:#9a6512}
.tag.plan{border-style:dashed}
table.t{border-collapse:collapse;width:100%;font-size:.95rem}
table.t td,table.t th{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}

/* practice frame */
.pr{max-width:920px;margin:0 auto;min-height:calc(100vh - 170px);display:flex;flex-direction:column}
.prtop{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1.5px dashed var(--line)}
.prtitle{font-weight:700}
.segs{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.seg{font-size:.78rem;padding:2px 10px;border-radius:10px;border:1.3px solid var(--line);color:var(--ink2)}
.seg.done{background:var(--paper2)}
.seg.on{border-color:var(--ink);color:var(--ink);background:var(--lampsoft)}
.prbody{flex:1;padding:34px 8px 20px;animation:fade .35s}
.prfoot{display:flex;justify-content:space-between;align-items:center;border-top:1.5px dashed var(--line);padding-top:10px}
.src{font-size:.78rem;color:var(--ink2)}
.thought{font-size:1.6rem;padding:14px 22px;border-left:4px solid var(--lamp);background:var(--card);display:inline-block;min-height:2.2em}
.story{max-width:720px}
.story .who{font-size:.85rem;color:var(--ink2);margin-bottom:6px}
.story .line{font-size:1.2rem;animation:fade .5s}
.story .line.res{color:var(--ink2);font-style:italic}
.story .q{font-weight:700;margin-top:14px}
.story .picked{color:var(--ink2)}

/* breathing */
.breath{height:260px;display:flex;align-items:center;justify-content:center}
.bc{width:150px;height:150px;border-radius:50%;border:2px solid var(--ink);background:radial-gradient(circle,var(--lampsoft) 0%,rgba(247,226,184,.25) 70%);transform:scale(.8)}
.count{font-size:4rem;text-align:center;margin:30px 0}
.dots{display:flex;gap:22px;margin:22px 0}
.dot{width:74px;height:74px;border-radius:50%;border:2px dashed var(--ink2);background:transparent;cursor:pointer}
.dot.on{border-style:solid;border-color:var(--ink);background:var(--lampsoft)}
.scale5{display:flex;gap:8px;margin:16px 0;align-items:stretch}
.scale5 .btn{flex:1;text-align:center;padding:14px 6px;font-size:.9rem}
.rangewrap{max-width:560px}
.rangewrap input{width:100%;accent-color:var(--lamp)}
.rangeval{font-size:2.6rem;text-align:center}
.rangelab{display:flex;justify-content:space-between;font-size:.82rem;color:var(--ink2)}
.ring{width:170px;height:170px;margin:20px auto;display:block}
.ring circle.p{stroke-dasharray:440;stroke-dashoffset:440;animation:ring 8s linear forwards}
@keyframes ring{to{stroke-dashoffset:0}}

/* hook */
.hookwrap{position:relative;height:260px;max-width:560px}
.hookwrap svg{position:absolute;left:30px;top:0;width:90px;height:220px}
.hookwrap .ht{position:absolute;left:110px;top:150px;font-size:1.35rem;background:var(--card);border:1.5px solid var(--ink);border-radius:var(--r);padding:8px 16px;transition:transform 2.4s ease-in,opacity 2.4s}
.hookwrap.free .ht{transform:translate(160px,-140px) rotate(-8deg);opacity:.15}

/* bottle */
.bottlefly{width:120px;height:120px;margin:10px 0}
.bottlefly.go{animation:float 3s ease-in forwards}
@keyframes float{to{transform:translate(380px,-40px) rotate(30deg);opacity:0}}
.note{background:var(--card);border:1.5px solid var(--ink);border-radius:var(--r);padding:20px 24px;font-size:1.3rem;max-width:620px;animation:fade .6s}
.note .sig{font-size:.9rem;color:var(--ink2);margin-top:8px}

/* cards */
.cards{display:flex;flex-wrap:wrap;gap:14px}
.gcard{width:300px;perspective:900px;cursor:pointer}
.gcard .in{display:grid;width:100%;transition:transform .6s;transform-style:preserve-3d}
.gcard.flip .in{transform:rotateY(180deg)}
.gcard .f,.gcard .b{grid-area:1/1;position:relative;min-height:160px;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1.6px solid var(--ink);border-radius:var(--r);background:var(--card);padding:14px 16px 10px;font-size:.95rem;line-height:1.55}
.gcard .b{transform:rotateY(180deg);background:#fffdf7}
.gcard h4{margin:0 0 6px;font-size:1.05rem}
.gcard .it{margin-top:8px;font-size:.85rem;color:var(--ink2);border-top:1px dashed var(--line);padding-top:6px}
.gcard.warm .f{border-color:var(--lamp);box-shadow:0 0 0 3px var(--lampsoft)}

/* map */
.mapwrap{display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:start}
.map svg{width:100%;height:auto;display:block}
.fac{cursor:pointer}
.fac .glow{fill:var(--lamp);opacity:0}
.fac.lit .glow{opacity:.28}
.fac.focus .glow{opacity:.5;animation:pulse 1.6s infinite}
.fac.site .ic{stroke-dasharray:4 4;opacity:.6}
.fac:hover .lab{text-decoration:underline}
@keyframes pulse{50%{opacity:.18}}
.side{position:sticky;top:80px}
.mcard{background:var(--card);border:1.6px solid var(--ink);border-radius:var(--r);padding:16px 18px;animation:fade .3s}
.tipbox{display:flex;gap:10px;align-items:flex-start;margin-top:14px}
.tipbox svg{width:70px;flex:none}
.tipbox .bubble{padding:10px 14px;font-size:1rem}
.tipbox .bubble::before{display:none}
.tipbox .bubble p{font-size:1rem}

/* overview */
.ovhead{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:8px}
.ovhead h1{margin:0;font-size:1.9rem}
.legend{display:flex;gap:12px;margin-left:auto;font-size:.85rem;color:var(--ink2);align-items:center}
.flow{position:relative;display:grid;grid-template-columns:repeat(8,1fr);gap:14px;margin:26px 0 8px}
.st{position:relative;background:var(--card);border:1.6px solid var(--ink);border-radius:var(--r);padding:10px 10px 12px;cursor:pointer;transition:transform .15s;display:flex;flex-direction:column;gap:4px}
.st:hover{transform:translateY(-3px)}
.st.plan{border-style:dashed}
.st.sel{box-shadow:0 0 0 4px var(--lampsoft);border-color:var(--lamp)}
.st:not(:last-child)::after{content:"→";position:absolute;right:-14px;top:52px;color:var(--ink2);font-size:1rem}
.st .no{font-size:.75rem;color:var(--ink2)}
.st .nm{font-weight:700;font-size:1.1rem}
.st svg{width:100%;height:78px}
.st .fc{font-size:.78rem;color:var(--ink2);line-height:1.35}
.bracket{display:grid;grid-template-columns:repeat(8,1fr);gap:14px;margin-bottom:20px}
.bracket div{border-top:2.5px solid var(--lamp);padding-top:6px;font-size:.85rem;color:#8a5a10;text-align:center}
.bracket div.sim{border-top-style:dashed;border-color:var(--line);color:var(--ink2)}
.detail{display:grid;grid-template-columns:1.1fr 1fr;gap:22px}
.detail .box h3{margin-top:0}
.scrlist{display:flex;flex-direction:column;gap:8px}
.scrlist .btn{width:100%}
.facgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.facgrid .fi{border:1.4px solid var(--line);border-radius:var(--r);padding:8px 10px;background:var(--card);font-size:.88rem}
.facgrid .fi b{display:block}
.route{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.95rem}
.route span.s{padding:3px 10px;border:1.4px solid var(--ink);border-radius:10px;background:var(--card)}

/* modal / toast / demo */
.modalbg{position:fixed;inset:0;background:rgba(51,49,45,.35);display:flex;align-items:center;justify-content:center;z-index:50;animation:fade .2s}
.modal{background:var(--paper);border:1.8px solid var(--ink);border-radius:var(--r);padding:26px 30px;max-width:520px;width:92%;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 22px;border-radius:14px;z-index:60;animation:fade .3s;max-width:90%}
.demo{position:fixed;right:14px;bottom:14px;z-index:30;font-size:.85rem}
.demo summary{cursor:pointer;background:var(--card);border:1.4px solid var(--line);border-radius:12px;padding:4px 12px;color:var(--ink2);list-style:none}
.demo .dp{position:absolute;right:0;bottom:36px;background:var(--card);border:1.5px solid var(--ink);border-radius:var(--r);padding:12px 14px;width:290px;display:flex;flex-direction:column;gap:8px}
.demo .dp .chips{margin:0;gap:6px}
.demo .btn{padding:3px 10px;font-size:.82rem}
.crisis{border:2px solid var(--red);border-radius:var(--r);background:#fff;padding:14px 18px;margin:12px 0;max-width:620px}

.notice{background:var(--card);border:1.5px dashed var(--lamp);border-radius:12px;padding:6px 14px;font-size:.88rem;color:#8a5a10;margin-bottom:14px;display:inline-block}
.sand{position:relative;max-width:620px;min-height:130px;background:#efe3c8;border-radius:var(--r);padding:24px 28px;overflow:hidden;font-size:1.3rem;color:#7a6a4c;margin:14px 0}
.sand .tx{animation:erase 2.4s 1.1s forwards;white-space:pre-wrap}
.sand .wv{position:absolute;left:-110%;top:0;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(185,207,205,.95) 40%,rgba(219,230,228,.95) 70%,transparent);animation:wave 2.8s .9s ease-in-out forwards}
@keyframes erase{to{opacity:0;filter:blur(6px)}}
@keyframes wave{to{left:110%}}
.mapwrap{grid-template-columns:1fr 340px}
@media (max-width:820px){
  body{font-size:16px}
  .scene{grid-template-columns:1fr;min-height:auto}
  .scene .art svg{max-width:160px}
  .bubble::before{display:none}
  .mapwrap,.detail,.grid2,.grid3{grid-template-columns:1fr}
  .flow,.bracket{grid-template-columns:repeat(2,1fr)}
  .st:not(:last-child)::after{display:none}
  .facgrid{grid-template-columns:repeat(2,1fr)}
  header{flex-wrap:wrap;padding:8px 12px;gap:8px}
  main{padding:14px 14px 90px}
  .opts .btn{min-width:0;width:100%}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <filter id="pencil"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.2"/></filter>
</svg>
<header>
  <div class="brand"><i></i>登大人島</div>
  <div class="hsp"></div>
  <span id="hw" class="row" style="margin:0;gap:8px">
    <button class="hbtn" data-quick="map">地圖</button>
    <button class="hbtn" data-quick="bag">貝殼袋</button>
    <button class="hbtn need" data-quick="lighthouse">需要人</button>
  </span>
</header>
<main id="stage"></main>
<details class="demo" id="demo">
  <summary>展演控制</summary>
  <div class="dp" id="dp"></div>
</details>
<div id="modalroot"></div>

<script>
/* ============ 基本工具 ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let H={},hid=0,timers=[],mounts=[],cur={name:'dock'},VIEW='overview';
function h(fn){const id='h'+(hid++);H[id]=fn;return id;}
function B(label,fn,cls=''){return `<button class="btn ${cls}" data-h="${h(fn)}">${label}</button>`;}
function L(label,fn){return `<button class="linkb" data-h="${h(fn)}">${label}</button>`;}
function later(fn,ms){timers.push(setTimeout(fn,ms));}
function mount(fn){mounts.push(fn);}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-h]'); if(t&&H[t.dataset.h]){H[t.dataset.h](t,e);return;}
  const v=e.target.closest('[data-view]'); if(v){setView(v.dataset.view);return;}
  const fl=e.target.closest('[data-flip]'); if(fl){fl.classList.toggle('flip');return;}
  const q=e.target.closest('[data-quick]'); if(q){saveProgress();setView('walk',true);go(q.dataset.quick);return;}
});
function toast(msg){const d=document.createElement('div');d.className='toast';d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),2800);}
function modal(html){$('#modalroot').innerHTML=`<div class="modalbg"><div class="modal">${html}</div></div>`;}
function closeModal(){$('#modalroot').innerHTML='';}

/* ============ 狀態（展演版：只存在這個分頁的記憶體，重新整理就清空） ============ */
function fresh(){return {cards:[],skills:{present:[0,0,0],defuse:[0,0,0]},bottles:[],kept:[],ifthen:null,inprogress:null,emails:[],visits:0,forceSit:null,reviewDue:false,mapLit:null,lastQuick:'雙腳踩地，慢慢吐一口氣',returned:false,done:[],last:null,greetN:0};}
let S=fresh();
let U=null; // 練習單元進行中
let K={};   // 站穩一分鐘／快速版的內部狀態

function addCard(c){const i=S.cards.findIndex(x=>x.id===c.id);if(i>=0){c.log=S.cards[i].log||[];if(!c.when&&S.cards[i].when){c.when=S.cards[i].when;c.do=S.cards[i].do;c.it=S.cards[i].it;}S.cards[i]=c;}else{c.log=c.log||[];S.cards.push(c);}did(c.id,c.title);}
function did(k,title){if(!S.done.includes(k))S.done.push(k);S.last={k,title};}
function today(){const d=new Date();return (d.getMonth()+1)+'/'+d.getDate();}
function pickLine(arr){return arr[(S.greetN++)%arr.length];}
function cardWithPlan(){return [...S.cards].reverse().find(c=>c.when);}
const CRISIS=['想死','不想活','自殺','結束生命','傷害自己','活不下去','去死'];
function crisis(t){return CRISIS.some(w=>t.includes(w));}
function crisisBox(){return `<div class="crisis"><b>你寫下的話聽起來很重。現在就有人可以聽：</b><br>1925 安心專線（24 小時、免付費）<br>1995 生命線（24 小時）<br>1980 張老師<br><span class="tiny">你也可以繼續寫，這些字不會公開。</span> ${L('去燈塔',()=>go('lighthouse'))}</div>`;}

/* ============ 線稿 ============ */
const ACHAO=`<svg viewBox="0 0 220 300" xmlns="http://www.w3.org/2000/svg"><circle cx="52" cy="240" r="34" fill="#e09a2e" opacity=".22"/><g fill="none" stroke="#33312d" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" filter="url(#pencil)">
<path d="M162 292 C150 232 158 150 178 118 C194 150 194 232 178 292 Z"/><path d="M170 282 L178 128"/>
<path d="M80 160 C70 200 66 240 70 292"/><path d="M130 160 C140 200 142 240 138 292"/><path d="M80 160 C95 150 115 150 130 160"/><path d="M92 160 l13 18 l13 -18"/>
<circle cx="105" cy="120" r="26"/><ellipse cx="105" cy="99" rx="48" ry="10"/><path d="M80 98 C82 74 128 74 130 98"/><path d="M84 92 h42"/>
<path d="M94 121 q3 3 6 0"/><path d="M110 121 q3 3 6 0"/><path d="M98 133 q7 5 14 0"/>
<path d="M80 172 C66 192 58 206 52 216"/><path d="M130 174 C140 192 150 198 160 200"/>

  const sit=situation();
  if(sit==='A')return tip(['嗨，剛上岸吧？我是阿潮。','這裡可以練習照顧情緒，也可以撿一句別人留下的話。今天沒什麼困擾，也能來逛逛。'])+`<div class="opts" style="animation-delay:.9s">${B('先喘口氣（1 分鐘）',()=>startSteady({from:'haven'}),'primary')}${B('跟我逛一圈（約 1 分鐘）',()=>{TOUR=0;go('tour')})}${B('我有一件事想處理',()=>go('dock',{sit:'A1'}))}${B('我自己逛',()=>{S.greetOff=true;renderMapSide()},'ghost sm')}</div>`;
  if(sit==='S')return tip([pickLine([`剛剛做完「${S.last.title}」了。`,`「${S.last.title}」收進貝殼袋了。`]),nextHint()])+`<div class="opts" style="animation-delay:.9s">${nextOpts().join('')}${B('我自己逛',()=>{S.greetOff=true;renderMapSide()},'ghost sm')}</div>`;
  const cp=cardWithPlan();
  const L2={C:'這麼晚還醒著啊。',D:pickLine(HELLO_BACK),E:pickLine(HELLO_BACK),F:'上次的練習停在一半，要接著做嗎？'};
  const L3={C:'要聽我說一下嗎？',D:'要聽我說一下嗎？',E:cp?`上次你說，如果${cp.when}，就${cp.do}。這幾天有遇到嗎？`:'',F:''};
  return tip([L2[sit],L3[sit]].filter(Boolean))+`<div class="row">${sit==='E'&&cp?B('跟阿潮說說',()=>go('review',{id:cp.id}),'primary sm'):B('聽阿潮說',()=>go('dock'),'primary sm')}${B('我自己逛',()=>{S.greetOff=true;renderMapSide()},'ghost sm')}</div>`;
}

function situation(){
  if(S.forceSit)return S.forceSit;
  if(S.inprogress)return 'F';
  if(S.returned&&S.reviewDue&&cardWithPlan())return 'E';
  const hr=new Date().getHours(); if(hr>=23||hr<5)return 'C';
  if(S.returned&&S.cards.length)return 'D';
  if(S.last)return 'S';
  return 'A';
}
SCR.dock=a=>{
  const sit=a.sit||situation();
  const toMap=(lit)=>()=>{S.mapLit=lit||null;go('map')};
  if(sit==='A') return say(['嗨，你剛上岸吧？我是阿潮，在這座島住一陣子了。','這裡可以練習照顧情緒，也可以撿一句別人留下的話；今天沒什麼困擾，也能來逛逛。','我猜你現在想……'],[
    B('先喘口氣（1 分鐘）',()=>startSteady({from:'haven'}),'primary'),
    a.afterTour?'':B('看看這座島',()=>{TOUR=0;go('tour')}),
    B('我有一件事想處理',()=>go('dock',{sit:'A1'})),
    B('都不是，我自己逛',toMap()),B('我要離開了',()=>go('leave'),'ghost sm')]);
  if(sit==='A1') return say(['好。是心裡的事，還是生活上的事？'],[
    B('心裡卡卡的',()=>go('hut'),'primary'),B('生活上有事要搞定（還在籌備）',()=>go('street')),B('說不上來',()=>go('dock',{sit:'B'}))]);
  if(sit==='B') return say(['也是，有時候就是說不上來。','我猜先坐一下也不錯？'],[
    B('先坐一下',()=>go('haven'),'primary'),B('隨便看看',toMap(['haven','hut'])),B('都不是',toMap())]);
  if(sit==='C') return say(['這麼晚還醒著啊。','我猜你現在想……'],[
    B('讓腦袋安靜一點',()=>go('haven'),'primary'),B('放下一件心事',()=>go('letgo')),B('我只是逛逛',toMap()),B('都不是',toMap())]);
  if(sit==='D'){const c=S.cards[S.cards.length-1]||{title:'站穩一分鐘'};const cp=cardWithPlan();
    return say([pickLine(HELLO_BACK),cp?`上次你留了一句：如果${cp.when}，就${cp.do}。有用到的話，可以跟我說說。`:`上次的「${c.title}」還在貝殼袋裡。`],[
    cp?B('記一下用到的時候',()=>go('review',{id:cp.id}),'primary'):B('翻一下貝殼袋',()=>go('bag'),'primary'),
    B(`再做一次「${c.title}」的快速版`,()=>c.unit==='defuse'?startUnhook():startSteady({from:'haven'})),B('先喘口氣',()=>startSteady({from:'haven'})),B('都不是',toMap())]);}
  if(sit==='E'){const cp=cardWithPlan();return SCR.review({id:cp?cp.id:null});}
  if(sit==='S'){const t=S.last.title;
    return say([pickLine([`剛剛做完「${t}」了。`,`「${t}」做完啦。`,`嗯，「${t}」收好了。`]),nextHint()],nextOpts().concat([B('都不是',toMap())]));}
  if(sit==='F'){const p=S.inprogress||{id:'defuse',step:6,seg:'自己做一次'};const t=UNITS[p.id].title;return say([`上次的「${t}」停在「${p.seg}」那裡。`,'要接著做嗎？'],[
    B('接著做',()=>{S.inprogress=null;S.forceSit=null;startUnit(p.id,p.step,p.d)},'primary'),B('從頭來',()=>{S.inprogress=null;S.forceSit=null;startUnit(p.id,0)}),B('今天先不要',toMap()),B('都不是',toMap())]);}
};

const HELLO_BACK=['欸，你回來了。','又見面了。','今天的浪還好嗎？','好一陣子沒看到你，島上一樣慢慢的。'];
function nextHint(){
  if(S.last&&S.last.k==='letgo')return '要不要再坐一下，或直接離島都可以。';
  if(S.last&&S.last.k==='bottle')return '你的瓶子在岸邊等著漂出去了。想走的時候，從碼頭離島就好。';
  if(!S.done.includes('beach'))return pickLine(['海邊有別的島民留的話，可以去撿一個。','想再走走的話，海邊有人留了話給你。']);
  return pickLine(['想走的時候，從碼頭離島就好。','累了就直接離島，也很好。']);}
function nextOpts(){const o=[];
  if(S.last&&S.last.k==='letgo')o.push(B('再坐一下，什麼都不做',()=>go('rest'),'primary'));
  else if(!S.done.includes('beach'))o.push(B('去海邊看看',()=>go('beach'),'primary'));
  o.push(B('帶著卡片離島',()=>go('leave'),o.length?'':'primary'));
  if(!S.done.includes('present')&&!S.done.includes('defuse'))o.push(B('去浪板小屋練完整的',()=>go('hut')));
  return o;}

SCR.rest=()=>`<div class="fpage" style="text-align:center;padding-top:60px"><p class="big">坐著就好，什麼都不用做。</p><p class="lead">想走的時候再按。</p><div class="row" style="justify-content:center">${B('先到這裡（離島）',()=>go('leave'),'primary')}${B('回地圖逛逛',()=>go('map'))}${B('去燈塔找人',()=>go('lighthouse'))}</div></div>`;

function saveProgress(){

  if(!inUnit)return false;
  S.inprogress={id:U.id,step:U.step,seg:SEGS[UNITS[U.id].steps[U.step].seg]||'最後',d:JSON.parse(JSON.stringify(U.d))};
  const extra=[...document.querySelectorAll('#stage textarea,#stage input[type=text]')].some(el=>el.value.trim())?'剛打的字還沒送出，不會被保存。':'';

function pframe({title,segs,seg,body,source,onLeave}){

SCR.steady=()=>{
  const segs=K.short?['叫出名字','吐氣一輪','看 3 樣']:['叫出名字','長長吐氣','看聽摸','我在哪'];
  const nx=(i)=>()=>{K.i=i;go('steady')};
  let body='';
  if(K.i===0){
    if(!K.emo) body=`<p class="lead">跟著畫面做就好，隨時可以停。</p><h2>現在比較像哪一種？點一個就好。</h2>
      <div class="chips">${['煩','慌','累','悶','難過','說不上來','還好，只想試試'].map(x=>B(x,()=>{K.emo=x;go('steady')},'chip')).join('')}</div>
      ${K.short||K.from==='unit'?'':`<p class="right">${L('只要 30 秒 →',()=>{K.short=true;go('steady')})}</p>`}`;
    else{body=`<h2>${K.emo==='說不上來'?'說不上來也是一種答案。':K.emo==='還好，只想試試'?'好，那就輕鬆練一次，當作認識這座島。':`好，是「${K.emo}」。它在，沒關係。`}</h2><p class="tiny">選的字不會存。</p><div class="row">${B('繼續',nx(1),'primary')}</div>`;
      mount(()=>later(nx(1),2200));}
  } else if(K.i===1){
    if(K.alt){body=`<h2>雙手互壓 5 秒，再放開。</h2><div class="count" id="cnt">5</div>`;
      mount(()=>{let n=5;const tick=()=>{n--;const el=$('#cnt');if(!el)return;if(n<=0){el.textContent='放開';later(()=>{K.alt=false;K.i=2;go('steady')},1300)}else{el.textContent=n;later(tick,1000)}};later(tick,1000)});}
    else if(!K.ready){const rounds=K.short?1:3;
      body=`<h2>接下來呼吸 ${rounds} 輪。</h2><p class="lead">用鼻子吸一口，再補吸一小口；然後用嘴巴慢慢吐，吐得比吸的長。<br>跟著圓圈變大、變小就好。</p><div class="breath" style="height:200px"><div class="bc"></div></div>
        <div class="row">${B('準備好了',()=>{K.ready=1;go('steady')},'primary')}${B('呼吸讓我更不舒服',()=>{K.alt=true;go('steady')},'ghost sm')}${B('跳過這步',nx(2),'ghost sm')}</div>`;}
    else{const rounds=K.short?1:3;
      body=`<h2 id="bt">開始囉</h2><div class="breath"><div class="bc" id="bc"></div></div><p class="tiny" id="br">共 ${rounds} 輪　頭暈就放慢。</p>
        <div class="row">${B('呼吸讓我更不舒服',()=>{K.alt=true;go('steady')},'ghost sm')}${B('跳過這步',nx(2),'ghost sm')}</div>`;
      mount(()=>{let r=0;const cyc=()=>{const bc=$('#bc'),bt=$('#bt'),br=$('#br');if(!bc)return;
        br.textContent=`第 ${r+1} / ${rounds} 輪　頭暈就放慢。`;bt.textContent='用鼻子吸一口……';bc.style.transition='transform 2s ease-out';bc.style.transform='scale(1.3)';
        later(()=>{bt.textContent='再補吸一小口';bc.style.transition='transform 1s ease-out';bc.style.transform='scale(1.45)'},2000);
        later(()=>{bt.textContent='用嘴巴慢慢吐，吐得比吸的長……';bc.style.transition='transform 5.5s ease-in-out';bc.style.transform='scale(.75)'},3000);
        later(()=>{r++;if(r<rounds)cyc();else{bt.textContent='好。';later(nx(2),900)}},8800);};later(cyc,600);});}
  } else if(K.i===2){
    if(K.ph===0) body=`<h2>看看四周，找 3 樣看得到的東西。</h2><p class="lead">每找到一樣，就點一個圈。</p>
      <div class="dots">${[0,1,2].map(j=>`<button class="dot ${j<K.see?'on':''}" data-h="${h(()=>{if(K.see<3){K.see++;go('steady');if(K.see>=3)later(()=>{if(K.short){K.i=3;K.end=1}else K.ph=1;go('steady')},600)}})}"></button>`).join('')}</div>`;
    else if(K.ph===1) body=`<h2>現在聽得到什麼聲音？</h2><p class="lead">停一下，找一個聲音。</p><div class="row">${B('聽到了',()=>{K.ph=2;go('steady')},'primary')}${B('找不到，先跳過',()=>{K.ph=2;go('steady')},'ghost sm')}</div>`;
    else body=`<h2>摸一下身邊的東西，是什麼觸感？</h2><div class="chips">${['軟的','硬的','涼的','暖的','說不上來'].map(x=>B(x,nx(3),'chip')).join('')}</div>`;
  } else if(K.i===3&&!K.end){
    body=`<h2>你在哪裡？現在在做什麼？</h2><p class="lead">在心裡回答就好。</p><div class="row">${B('繼續',()=>{K.end=1;go('steady')},'primary')}</div>`;
  } else {
    if(K.from==='unit'&&K.onDone){mount(()=>K.onDone());return '';}
    if(!K.feel){body=feelAsk(x=>{K.feel=x;go('steady')});return pframe({title:'站穩一分鐘',segs,seg:segs.length,body,source:'參考情緒命名、長吐氣呼吸研究與 WHO 接地練習',onLeave:()=>go('map')});}
    if(K.feel==='更不舒服'){body=worseHTML();return pframe({title:'站穩一分鐘',segs,seg:segs.length,body,source:'',onLeave:()=>go('map')});}
    S.skills.present[0]=1;S.lastQuick='叫出名字、長長吐氣、看三樣東西';S.lastQuickUnit='present';S.worse=0;
    addCard({id:'steady',unit:'present',title:'站穩一分鐘',front:'<b>叫出名字 → 長長吐氣 → 看三樣</b><br>風暴可能還在，你可以先站穩一下。',back:'30 秒版：一輪長吐氣 → 看 3 樣東西<br>呼吸不舒服時：雙手互壓 5 秒<br>平常沒事的時候也練，風暴來時比較想得起來。'});
    body=`${feelReply(K.feel,'那三個動作')}<p class="lead">這張卡片收進貝殼袋了，想帶走可以截圖。</p>${cardHTML(S.cards.find(c=>c.id==='steady'))}${KEEPNOTE}${exits()}<p class="tiny">${L('再做一次',()=>startSteady({from:K.from}))}　${L('換一個練習',()=>go('haven'))}</p>`;
    return pframe({title:'站穩一分鐘',segs,seg:segs.length,body,source:'參考情緒命名、長吐氣呼吸研究與 WHO 接地練習',onLeave:()=>go('map')});
  }
  const seg=K.short?Math.min(K.i,2):K.i;
  return pframe({title:'站穩一分鐘'+(K.short?'・30 秒版':''),segs,seg,body,source:'參考情緒命名、長吐氣呼吸研究與 WHO 接地練習',onLeave:()=>{saveProgress();go(K.from==='unit'?'hut':'haven')}});
};

    body=`${feelReply(K.feel,'那三步')}<p class="lead">這張卡片收進貝殼袋了，想帶走可以截圖。</p>${cardHTML(S.cards.find(c=>c.id==='unhook'))}${KEEPNOTE}${exits()}<p class="tiny">${L('再做一次',startUnhook)}　${L('換一個練習',()=>go('haven'))}</p>`;

function storyStep(d,s,nextLabel){

  if(!d.ch){html+=`<div class="chips">${s.like.map(x=>B(x,()=>{d.ch=x;go('unit')},'chip')).join('')}</div></div>`;return html;}
  html+=`<p class="line res">${d.ch==='都不像'?`不像也沒關係，看看${s.name}試了什麼就好。`:`「${esc(d.ch)}」——不少前輩也卡過這裡。看看${s.name}試了什麼：`}</p>`;

SCR.review=a=>{
  const c=S.cards.find(x=>x.id===a.id)||cardWithPlan()||S.cards[S.cards.length-1];
  if(!c)return say(['袋子裡還沒有卡片。','先做一個練習，就會有第一張。'],[B('先喘口氣（1 分鐘）',()=>startSteady({from:'haven'}),'primary'),B('去地圖',()=>go('map'))]);
  const id=c.id, plan=c.when?`如果${c.when}，就${c.do}`:null;
  const re=(o)=>()=>go('review',Object.assign({id},a,o));
  const done=()=>{S.reviewDue=false;};
  if(!a.ans) return say([plan?`上次你說，${plan}。`:`上次你帶走了「${c.title}」。`,plan?'這幾天有遇到嗎？':'這幾天有用到嗎？'],[
    B('有，也試了',re({ans:'yes'}),'primary'),B('有，但沒想起來',re({ans:'forgot'})),B('還沒遇到',re({ans:'not'})),B('先不想這個',re({ans:'skip'}))]);
  if(a.ans==='yes'){
    if(!a.at) return say(['哇，帶回生活是最難的那一步。','是在什麼時候？'],[...(c.when?[c.when]:[]),'讀書或工作時','睡前','和人相處的時候','別的時候'].filter((x,i,arr)=>arr.indexOf(x)===i).map(x=>B(x,re({at:x}),'chip')));
    if(!a.how) return say([`${a.at}。`,'試了之後怎麼樣？'],['有一點用','差不多','說不上來'].map(x=>B(x,re({how:x}),'chip')));
    if(!a.saved){c.log.push({date:today(),text:`${a.at}・${a.how}`});S.skills[c.unit][2]=1;done();a.saved=1;}
    return say([a.how==='有一點用'?'記下來了。下次遇到，你會更快想起它。':'差不多也算數，你記得用了。','「在生活中用過」那一格亮起來了。'],[
      B('打開貝殼袋',()=>go('bag'),'primary'),B('改一下「如果—就」',re({ans:'edit'})),B('去地圖',()=>go('map'))]);}
  if(a.ans==='forgot'){
    if(!a.rm) return say(['很正常，我以前也是事後才想到。想到本身就算一次。','要換一個提醒方法嗎？'],['換鬧鐘名稱','換成鎖定畫面','不用'].map(x=>B(x,re({rm:x}),'chip')));
    if(!a.saved){c.log.push({date:today(),text:'事後才想起來'});done();a.saved=1;}
    return say([({'不用':'好，照舊。','換鬧鐘名稱':'好，改用鬧鐘提醒。','換成鎖定畫面':'好，改用鎖定畫面提醒。'})[a.rm],'卡片先放著，下次再試試。'],[B('打開貝殼袋',()=>go('bag'),'primary'),B('改一下「如果—就」',re({ans:'edit'})),B('去地圖',()=>go('map'))]);}
  if(a.ans==='not'){done();return say(['那卡片先放著，等它派上用場。'],[B('打開貝殼袋',()=>go('bag'),'primary'),B('去地圖',()=>go('map'))]);}
  if(a.ans==='edit'){
    if(!a.nw) return say(['要改成什麼時候？'],['腦袋很吵的時候','開始讀書或工作時','滑到別人動態時','睡前','緊張的時候'].map(x=>B(x,re({nw:x}),'chip')));
    c.when=a.nw;c.do=c.do||S.lastQuick;c.it=`如果${c.when}，我就${c.do}。`;S.ifthen={when:c.when,do:c.do,unit:c.unit};
    return say(['卡片更新了。',`如果${c.when}，就${c.do}。`],[B('打開貝殼袋',()=>go('bag'),'primary'),B('去地圖',()=>go('map'))]);}
  done();return say(['好，那今天就隨便走走。'],[B('去地圖',()=>go('map'),'primary')]);
};

 <div class="box" id="join" style="border-color:var(--lamp);border-width:2px"><h3>想當第一批試住的島民？</h3><p>留下 email，有新版本時我們會寄邀請給你。</p>
  ${a.sent?`<p class="big">記下了，謝謝你。</p><p class="tiny">（展演版：還沒接資料庫，11/14 接上。目前這台裝置記了 ${S.emails.length} 筆。）</p>${B('換下一位填',()=>go('bulletin',{focus:'join'}),'sm')}`:
  `<p class="tiny">展演版：email 先記在這台裝置，還沒接資料庫（11/14 接上），不會馬上收到信。</p><input type="text" id="em" placeholder="you@example.com" style="max-width:380px"><div class="chips">${['想當測試者','想一起做','可以提供專業意見'].map(x=>`<label class="chk" style="margin-right:14px"><input type="checkbox" class="ro" value="${x}"> ${x}</label>`).join('')}</div>
   <div class="row">${B('留下 email',()=>{const v=$('#em').value.trim();if(!/\S+@\S+\.\S+/.test(v)){toast('email 格式好像不太對');return}S.emails.push({email:v,roles:[...document.querySelectorAll('.ro:checked')].map(x=>x.value)});go('bulletin',{sent:1,focus:'join'})},'primary')}</div>`}</div></div>`;};

/* ---- 生活街／茶屋／工地 ---- */
SCR.street=()=>`<div class="fpage">${fhead('street','生活街','前輩怎麼自己生活。')}<div class="chips">${['租房','自己生活','交通','稅務與錢','工作與打工'].map(x=>`<span class="tag plan">${x}・工地</span>`).join('')}</div>
 <div class="box"><p>這裡還在蓋，之後會開放。</p><p class="tiny">之後會有：第一批 3 篇生活指南（例：第一次自己租房：看房前要問的事）。每篇都有「10 分鐘內的第一步」和官方連結。</p></div>
 <div class="row">${B('開放時想知道 → 公佈欄',()=>go('bulletin',{focus:'join'}))}${B('回地圖',()=>go('map'),'ghost')}</div></div>`;
SCR.tea=()=>`<div class="fpage">${fhead('tea','前輩茶屋','前輩留下的經驗。')}<div class="box"><p>茶屋還在整修。想當第一批來說故事的前輩？在公佈欄留下 email。</p><p class="tiny">之後會有：前輩經驗投稿（那時候的我／卡在哪／我試過什麼／現在回頭看／給你的一句話），練習頁可以連過來：「前輩也遇過 →」。</p></div>
 <div class="row">${B('去公佈欄',()=>go('bulletin',{focus:'join'}))}${B('回地圖',()=>go('map'),'ghost')}</div></div>`;
SCR.site=()=>`<div class="fpage">${fhead('site','工地','整修中，之後會開放')}<div class="box"><p>這裡還在蓋，之後會開放。</p><p class="tiny">之後會有：善待自己、依價值行動、為情緒留空間三個練習；漂流瓶回應；島民共創內容。</p></div>
 <div class="row">${B('開放時想知道 → 公佈欄',()=>go('bulletin',{focus:'join'}))}${B('回地圖',()=>go('map'),'ghost')}</div></div>`;

/* ============ 流程總覽 ============ */
const ST=[
 {n:1,nm:'上岸',ic:'dock',fac:'碼頭・阿潮',st:'run',what:'阿潮依 6 種情境問「我猜你現在想……」，把人帶到對的設施。',time:'20 秒',
  scr:[['第一次上岸（情境 A）',()=>goWalk('dock',{sit:'A'})],['深夜上岸（情境 C）',()=>goWalk('dock',{sit:'C'})],['說不上來（情境 B）',()=>goWalk('dock',{sit:'B'})]]},
 {n:2,nm:'看地圖',ic:'island',fac:'全島地圖・阿潮導覽',st:'run',what:'10 個設施各一行說明，開著的點燈、還在蓋的畫虛線；第一次來可以跟阿潮導覽 7 站。',time:'30 秒–1 分',
  scr:[['全島地圖',()=>goWalk('map')],['阿潮導覽（7 站）',()=>{TOUR=0;goWalk('tour')}]]},
 {n:3,nm:'做一件事',ic:'hut',fac:'避風港・浪板小屋',st:'run',what:'很亂時進避風港直接跟著做；有力氣時去浪板小屋練完整單元。每頁都能「現在做不到」或「先到這裡」。',time:'1–10 分',
  scr:[['避風港・站穩一分鐘',()=>{setView('walk',true);startSteady({from:'haven'})}],['避風港・鬆開一句話',()=>{setView('walk',true);startUnhook()}],['避風港・放下一件心事',()=>goWalk('letgo')],['浪板小屋',()=>goWalk('hut')],['完整單元：回到當下',()=>{setView('walk',true);startUnit('present',0)}],['完整單元：脫鉤',()=>{setView('walk',true);startUnit('defuse',0)}]]},
 {n:4,nm:'收進貝殼袋',ic:'bag',fac:'貝殼袋',st:'run',what:'做完的練習變成卡片，技能三格只寫狀態：認識了／自己試過／在生活中用過。',time:'10 秒',
  scr:[['打開貝殼袋',()=>goWalk('bag')]]},
 {n:5,nm:'留一句話',ic:'beach',fac:'漂流瓶海灘',st:'run',what:'撿一句島民留下的話，或丟一句給下一個人（經審核才漂出去）。練習裡的「給朋友一句話」也可以選擇流到這裡。',time:'1 分',
  scr:[['撿一個',()=>goWalk('beach',{mode:'pick'})],['丟一個',()=>goWalk('beach',{mode:'drop'})]]},
 {n:6,nm:'離島',ic:'dock',fac:'碼頭',st:'run',what:'留一句「如果—就」給下次的自己，阿潮送別；不說明天見、不跳通知。展場在這裡接「留 email」。',time:'20 秒',
  scr:[['離島',()=>goWalk('leave')],['留 email（公佈欄）',()=>goWalk('bulletin',{focus:'join'})]]},
 {n:7,nm:'回來',ic:'back',fac:'碼頭情境 D／E／F・貝殼袋',st:'sim',what:'3 天後回來，阿潮問「這幾天有遇到嗎？」；練習做到一半的人可以接著做。展場用「展演控制」模擬。',time:'示範用',
  scr:[['模擬：3 天後回顧（情境 E）',()=>{S.reviewDue=true;if(!S.ifthen)S.ifthen={when:'腦袋很吵的時候',do:'雙腳踩地、找 3 樣看得到的東西',unit:'present'};goWalk('dock',{sit:'E'})}],['模擬：回來的人（情境 D）',()=>goWalk('dock',{sit:'D'})],['模擬：做到一半（情境 F）',()=>{if(!S.inprogress)S.inprogress={id:'defuse',step:6,seg:'自己做一次'};goWalk('dock',{sit:'F'})}]]},
 {n:8,nm:'成為前輩',ic:'senior',fac:'漂流瓶回應・前輩茶屋',st:'plan',what:'練過的人把經驗留給下一個人：回應瓶子（1 月）、到前輩茶屋投稿（工地）。島上的內容慢慢由島民一起長出來。',time:'之後',
  scr:[['前輩茶屋（工地）',()=>goWalk('tea')],['漂流瓶海灘',()=>goWalk('beach')]]}
];
let OVSEL=2;
function goWalk(name,arg){setView('walk',true);go(name,arg);}
function thumb(k){return `<svg viewBox="-60 -42 120 84"><path d="M-56 34 h112" stroke="#bdb5a6" stroke-width="1.5" stroke-dasharray="4 5"/><g fill="none" stroke="#33312d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#pencil)">${IC[k]}</g></svg>`;}
function renderOverview(){
  H={};timers.forEach(clearTimeout);timers=[];
  const s=ST[OVSEL];
  $('#stage').innerHTML=`<div class="ovhead"><div><div class="tiny">展演骨架 v0.4・2026/11/11</div><h1>登大人島的主旅程</h1><p class="lead">一個慢慢長大的地方。來賓在攤位上走第 1–6 站（約 3–5 分鐘），第 7–8 站用模擬和圖說明。</p></div>
   <div class="legend">${tag('run')}${tag('sim')}${tag('plan')}</div></div>
   <div class="flow">${ST.map((x,i)=>`<div class="st ${x.st==='plan'?'plan':''} ${i===OVSEL?'sel':''}" data-h="${h(()=>{OVSEL=i;renderOverview()})}"><div class="no">第 ${x.n} 站</div><div class="nm">${x.nm}</div>${thumb(x.ic)}<div class="fc">${x.fac}</div>${tag(x.st)}</div>`).join('')}</div>
   <div class="bracket"><div style="grid-column:1/7">展場體驗路線：來賓自己操作</div><div class="sim" style="grid-column:7/9">模擬示範＋圖說</div></div>
   <div class="detail">
    <div class="box"><div class="tiny">第 ${s.n} 站・${s.fac}・${s.time}</div><h3 style="font-size:1.5rem">${s.nm}</h3><p class="big">${s.what}</p><p>${tag(s.st)}</p></div>
    <div class="box"><h3>這一站的畫面</h3><div class="scrlist">${s.scr.map(([l,f])=>B(l+' →',f)).join('')}</div></div>
   </div>
   <div class="box" style="margin-top:18px"><h3>全島 10 個設施</h3><div class="facgrid">${Object.entries(FAC).map(([k,f])=>`<div class="fi" style="cursor:pointer" data-h="${h(()=>goWalk(f.to))}"><b>${f.n}</b>${f.line}<div style="margin-top:4px">${tag(f.st)}</div></div>`).join('')}</div>
    <p class="tiny" style="margin-top:10px">全島共用：每頁右上「需要人」連到燈塔；練習每頁都有「現在做不到」（只做 8 秒版／先到這裡／去燈塔）和「先到這裡」（停在哪裡會記著）。</p></div>
   <div class="box"><h3>建議的攤位快速路線（約 3 分鐘）</h3><div class="route"><span class="s">碼頭：先喘口氣</span>→<span class="s">避風港：站穩一分鐘</span>→<span class="s">卡片收進貝殼袋</span>→<span class="s">海灘撿一個瓶子</span>→<span class="s">離島</span>→<span class="s">留 email</span></div>
    <div class="row">${B('從碼頭開始走 →',()=>{goWalk('dock',{sit:'A'})},'primary')}</div></div>`;
}

/* ============ 展演控制 ============ */
function renderDemo(){
  const dp=$('#dp');if(!dp)return;
  dp.innerHTML=`<b>碼頭情境</b><div class="chips">${['A','B','C','D','E','F'].map(x=>`<button class="btn ${S.forceSit===x?'primary':''}" data-h="${h(()=>{S.forceSit=S.forceSit===x?null:x;if(x==='E'||x==='D')S.returned=true;if(x==='E'){S.reviewDue=true;if(!S.ifthen)S.ifthen={when:'腦袋很吵的時候',do:'雙腳踩地、找 3 樣看得到的東西',unit:'present'}}if(x==='F'&&!S.inprogress)S.inprogress={id:'defuse',step:6,seg:'自己做一次'};go('dock',{sit:x})})}">${x}</button>`).join('')}</div>
   <div class="tiny">A 第一次・B 說不上來・C 深夜・D 回來的人・E 3 天後回顧・F 做到一半</div>
   <div class="row" style="margin-top:4px">${B('模擬過幾天回來',()=>{S.returned=true;S.reviewDue=true;S.greetOff=false;S.forceSit=null;$('#demo').open=false;go('map')})}</div>
   <div class="row" style="margin-top:4px">${B('重新開始（下一位來賓）',()=>{const em=S.emails;S=fresh();S.emails=em;U=null;$('#demo').open=false;go('map')},'primary')}</div>
   <div class="tiny">已收 email：${S.emails.length} 筆（展演版只存在這個分頁）</div>`;
}

/* ============ 切換檢視 ============ */
function setView(v,silent){
  VIEW=v;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.view===v));
  $('#hw').style.display=v==='walk'?'':'none';$('#demo').style.display=v==='walk'?'':'none';
  if(location.hash!=='#'+v){try{history.replaceState(null,'','#'+v)}catch(e){location.hash=v}}
  if(!silent){v==='overview'?renderOverview():go('dock');}
}
setView('walk',true);go('map');
</script>
